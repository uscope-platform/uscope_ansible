
- hosts: localhost
  roles:
    - pre_build

- hosts: uzed
  remote_user: amd-edf
  become: true
  tasks:
    - name: push docker-compose
      copy:
        src: docker/docker-compose_zed.yml
        dest: /home/amd-edf/docker-compose.yml
        owner: amd-edf
        group: amd-edf
        mode: '0644'


- hosts: localhost
  tasks:
    - name: clean up the mess
      file:
        path: '{{ item }}'
        state: absent
      with_items:
        - docker


