- hosts: localhost
  roles:
    - pre_build

- hosts: uzed
  remote_user: amd-edf
  tasks:
    - name: remove old image archive
      file:
        name: server.tar
        state: absent
  
    - name: Remove server container
      docker_container:
        name: amd-edf-server-1
        state: absent

    - name: Remove server image
      docker_image:
        state: absent
        name: server
        tag: latest

- hosts: localhost
  tasks:
  
    - name: Clone server code
      git:
        repo: "https://github.com/uscope-platform/uscope_server_js"
        dest: docker/server/code

    - name: Build server container
      command:
        cmd: podman build --ssh default --platform linux/arm64 -t docker.io/library/server:latest server
        chdir: docker

    - name: Remove stale image archive (podman save will not overwrite)
      file:
        path: docker/server.tar
        state: absent

    - name: Export server image
      command:
        cmd: podman save -o server.tar docker.io/library/server:latest
        chdir: docker

    - name: push server images to target
      command: 
      args:
        cmd:  scp server.tar amd-edf@uscope_0.local:/home/amd-edf
        chdir: docker




- hosts: uzed
  remote_user: amd-edf
  tasks:
    - name: Load server image
      docker_image:
        name: server
        tag: latest
        load_path: server.tar
        source: load
      vars:
        ansible_command_timeout: 240