- hosts: localhost
  roles:
    - pre_build

- hosts: uzed
  remote_user: petalinux
  tasks:
    - name: remove old image archive
      file:
        name: server.tar
        state: absent
  
    - name: Remove server container
      docker_container:
        name: petalinux-server-1
        state: absent

    - name: Remove server image
      docker_image:
        state: absent
        name: server
        tag: latest

- hosts: localhost
  tasks:
  
    - name: Clone server code
      git:
        repo: "https://github.com/uscope-platform/uscope_server_js"
        dest: docker/server/code

    - name: Build server container
      shell: 
      args:
        cmd: docker buildx build --ssh default --platform linux/arm64 -t server:latest -o type=docker,dest=- server > server.tar
        chdir: docker
      
    - name: push server images to target
      command: 
      args:
        cmd:  scp server.tar petalinux@uscope_0.local:/home/petalinux
        chdir: docker




- hosts: uzed
  remote_user: petalinux
  tasks:
    - name: Load server image
      docker_image:
        name: server
        tag: latest
        load_path: server.tar
        source: load
      vars:
        ansible_command_timeout: 240