- hosts: localhost
  roles:
    - pre_build

- hosts: uzed
  remote_user: petalinux
  tasks:
    - name: remove old image archive
      file:
        name: server.tar
        state: absent
  
    - name: Remove server container
      docker_container:
        name: petalinux-server-1
        state: absent

    - name: Remove server image
      docker_image:
        state: absent
        name: server
        tag: latest

- hosts: localhost
  tasks:

    - name: get version
      shell:
        cmd: 'curl -s -H "Accept: application/vnd.github.VERSION.sha" "https://api.github.com/repos/uscope-platform/uscope_server/commits/main"'
      register: clone_result


    - name: Build server container
      shell: 
      args:
        cmd: docker buildx build --ssh default --platform linux/arm64 --build-arg SERVER_VER={{clone_result.stdout}} -t server:latest -o type=docker,dest=- server > server.tar
        chdir: docker
        
    - name: push server images to target
      command: 
      args:
        cmd:  scp server.tar petalinux@uscope_0.local:/home/petalinux
        chdir: docker




- hosts: uzed
  remote_user: petalinux
  tasks:
    - name: Load server image
      docker_image:
        name: server
        tag: latest
        load_path: server.tar
        source: load
      vars:
        ansible_command_timeout: 240