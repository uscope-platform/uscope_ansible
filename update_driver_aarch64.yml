- hosts: localhost
  tasks:
    - name: create container
      containers.podman.podman_container:
        name: aarch64_driver_compiler
        image: docker.io/library/ubuntu:noble
        command: bash
        interactive: true
        tty: true

    - name: add docker container to inventory
      add_host:
        name: aarch64_driver_compiler
        ansible_connection: containers.podman.podman

- hosts: aarch64_driver_compiler
  gather_facts: false
  roles:
    - arch_specific/build_driver_aarch64

- hosts: localhost
  roles:
    - pre_build

- hosts: uzed
  remote_user: amd-edf
  tasks:
    - name: remove old image archive
      file:
        name: driver.tar
        state: absent
  
    - name: Remove driver container
      docker_container:
        name: petalinux-driver-1
        state: absent

    - name: Remove driver image
      docker_image:
        state: absent
        name: driver
        tag: latest

- hosts: localhost
  tasks:
    - name: copy executable to container build dir
      copy:
        src: uscope_driver
        dest: docker/driver
        mode: '0755'

    - name: Build driver container
      command:
        cmd: podman build --ssh default --platform linux/arm64 -t docker.io/library/driver:latest driver
        chdir: docker

    - name: Remove stale image archive (podman save will not overwrite)
      file:
        path: docker/driver.tar
        state: absent

    - name: Export driver image
      command:
        cmd: podman save -o driver.tar docker.io/library/driver:latest
        chdir: docker
        
    - name: push driver images to target
      command: 
      args:
        cmd:  scp driver.tar amd-edf@uscope_0.local:/home/amd-edf
        chdir: docker

- hosts: uzed
  remote_user: amd-edf
  tasks:
    - name: Load driver image
      docker_image:
        name: driver
        tag: latest
        load_path: driver.tar
        source: load


- hosts: localhost
  tasks:
    - name: clean up the mess
      file:
        path: '{{ item }}'
        state: absent
      with_items:
        - uscope_driver
        - docker
