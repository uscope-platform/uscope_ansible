#                     BUILD CONTAINER

- name: Build database container
  command:
    cmd: podman build --ssh default --platform {{target_arch}} -t docker.io/library/{{container_tag}} database
    chdir: docker

- name: Remove stale image archive (podman save will not overwrite)
  file:
    path: docker/database.tar
    state: absent

- name: Export database container
  command:
    cmd: podman save -o database.tar docker.io/library/{{container_tag}}
    chdir: docker

#               PUSH CONTAINERS TO TARGET

- name: push database images to target
  command: 
  args:
    cmd:  scp database.tar {{remote_host}}:{{remote_dir}}
    chdir: docker
