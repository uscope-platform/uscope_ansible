- hosts: uzed
  remote_user: amd-edf
  tasks:

    - name: remove old image archive
      file:
        name: database.tar
        state: absent
  
    - name: Remove database container
      docker_container:
        name: amd-edf-database-1
        state: absent

    - name: Remove database image
      docker_image:
        state: absent
        name: database
        tag: latest

- hosts: localhost
  roles:
    - pre_build
    - role: build_database_container
      vars:
        container_tag: database:latest
        target_arch: linux/arm64
        remote_host: amd-edf@uscope_0.local
        remote_dir: /home/amd-edf

- hosts: uzed
  remote_user: amd-edf
  tasks:
    - name: Load database image
      docker_image:
        name: database
        tag: latest
        load_path: database.tar
        source: load